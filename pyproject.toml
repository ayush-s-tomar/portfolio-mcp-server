[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "portfolio-mcp-server"
version = "1.0.4"
description = "MCP server exposing Ayush Singh Tomar's AI project portfolio as queryable tools for Claude, Cursor, and other MCP clients"
dynamic = ["readme"]
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ayush Singh Tomar" }
]
keywords = ["mcp", "model-context-protocol", "portfolio", "ai-agents", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/ayush-s-tomar/portfolio-mcp-server"
Repository = "https://github.com/ayush-s-tomar/portfolio-mcp-server"
Issues = "https://github.com/ayush-s-tomar/portfolio-mcp-server/issues"
Changelog = "https://github.com/ayush-s-tomar/portfolio-mcp-server/blob/main/CHANGELOG.md"

[project.scripts]
portfolio-mcp-server = "portfolio_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["portfolio_mcp_server"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '<details[^>]*>\s*<summary><b>(.*?)</b></summary>\s*<br/>\s*'
replacement = '### \1\n\n'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\s*</details>'
replacement = ''